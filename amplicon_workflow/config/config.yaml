### CONFIG FILE FOR AMPLICON WORKFLOW ###
# This is a sample configuration file. Adjust the paths and parameters as needed.


### General Settings ###

# Threads for parallel processing (Don't run in parallel to basecalling/sequencing)
threads: 20 # Maximum is 20

# Run ID for the analysis
run_id: 20260708_Jiyeon_ethephon_bac_16S
### Basecalling and Demultiplexing ###

# Directory to raw sequencing data (.pod5)
pod5_dir: /mnt/d/MinKNOW/experiments/Jiyeon_Ethephon_bac_16S/Jiyeon_Ethephon_bac_16S/20260706_1509_MN45285_FBG30511_611d2e94/pod5_merged
# If you want to rerun the analysis without re-basecalling, set this to True otherwise set to False. 
# The workflow will extrapolate the location of the fastq files from the pod5 directory.
re_run: False

# Kit name for basecalling and demultiplexing
kit_name: SQK-NBD114-96 # e.g. Native Barcoding Kit 96 V14 = SQK-NBD114-96

### Trim, Concat and Filter ###

# PCR primer sequences (5'->3') to trim from the reads (no spaces)
Forward_primer: AGRGTTYGATYMTGGCTCAG
Reverse_primer: TACGGYTACCTTGTTACGACTT

# Minimum and maximum length of reads to keep
min_length: 1300
max_length: 1600
# Minimum quality score for filtering (10 = 10% error rate, 20 = 1% error rate)
min_quality: 20

# Clustering threshold should be set according to the minimal quality score of the reads.
cluster_threshold: 0.99   # Threshold for clustering reads (0.97 = 97% similarity)

# Choice of classification tool: "emu"
classification_tool: emu

### Emu parameters ###

taxonomic_rank: species   # Options: "species", "genus", "family", "order", "class", "phylum", "superkingdom"

# Path to the reference database 
# Some custom databases already exist locally (e.g. SILVA), check the resources/custom_dbs/ folder.
reference_db: /home/nanopore/projects/amplicon_workflow/resources/custom_dbs/silva_v138.2

# Minimal relative abundance of a taxon to be included in the final report (0.01 = 1% of reads)
min_abundance: 0.001


