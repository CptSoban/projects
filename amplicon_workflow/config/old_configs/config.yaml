### CONFIG FILE FOR AMPLICON WORKFLOW ###
# This is a sample configuration file. Adjust the paths and parameters as needed.


### General Settings ###

# Threads for parallel processing (Max=30)
threads: 8 # Not higher than 8 if other computational intensive systems (e.g., basecalling) are running

# Run ID for the analysis
run_id: pmoA_test

# Demultiplexed reads directory
demultiplexed_reads: /mnt/d/MinKNOW/experiments/Ethephon_project_pmoA_21-35_61-74/pmoA_21-35_61-74/20250722_1134_MN45285_FBC80869_e939cedf/fastq_pass

### Concat and Filter ###

# Minimum and maximum length of reads to keep
min_length: 500
max_length: 550
# Minimum quality score for filtering (10 = 10% error rate, 20 = 1% error rate)
min_quality: 20


# Chimera filtering settings
cluster_threshold: 0.99  # Threshold for clustering reads (0.97 = 97% similarity)


### Emu classification ###

taxonomic_rank: species  # Options: "species", "genus", "family", "order", "class", "phylum", "superkingdom"

# Path to the reference default database or prebuilt custom database
# Note that some prebuild alternative databases (e.g. SILVA) are available through the emu repository (https://osf.io/56uf7/files/osfstorage).
# The custom database folder should contain sequences.fasta, taxonomy.tsv (sequence id to taxid mapping) and species_taxid.tsv (taxid to lineage mapping)). 
# See /home/nanopore/projects/amplicon_workflow/resources/custom_dbs/pr2_510_emu/ for an example.
reference_db: /home/nanopore/projects/amplicon_workflow/resources/custom_dbs/gfz_pmoa


# Minimal relative abundance of a taxon to be included in the final report (0.01 = 1% abundance)
min_abundance: 0.001


# PCR primer sequences to trim from the reads in fasta format (header form: [id]_front/rear type=primer) (OPTIONAL)
#primer_fasta: "/home/nanopore/projects/amplicon_workflow/resources/primer_seq/27F_1492R.fa"