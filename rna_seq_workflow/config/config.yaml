#This is the configuration file for the rna_seq_worklow.
#You have to modify this file to your needs and fill out every option (if not stated otherwise), 
#but do not add or remove options if your not 100% sure what you are doing!

# Computational resources
threads: 50

#INPUT (Mandatory)

#Absolute path to your RNAseq reads directory. sample names should have the following format: ID_GROUP.fastq.gz
seq_dir: /home/nanopore/projects/rna_seq_workflow/resources/20240716_FOXY/reads
#Strandness of RNA-seq reads ["",0] for Unstranded, ["FR",1] for Stranded or ["RF",2] for Reverse Stranded
Strandness: ["RF",2]

#Absolute path to the reference genome fasta
ref_genome: /home/nanopore/projects/genome_annotation/results/fusarium_commune/repeatmasker/GCA_023065405.1_ASM2306540v1_genomic.fna.masked

#The ID for this analyis run
run id: 20250603_FCOM

#Absolute path to the genome annotation file (GTF) 
gtf: /home/nanopore/projects/genome_annotation/results/fusarium_commune/braker/braker.gtf

#Sample info file 
sample_info: /home/nanopore/projects/rna_seq_workflow/resources/20240716_FOXY/20240716_FOXY_info.csv

#Contrast .csv file containing a "treatment" column and a "control" column specifying what conditions should be contrasted. 
contrast :  /home/nanopore/projects/rna_seq_workflow/resources/20240716_FOXY/foxy_contrast.csv


#ADDITIONAL FEATURES (Optional)

### DIFFERENTIAL EXPRESSION ANALYSIS (DESeq2) ["yes",""] ###
DEG_analysis: "yes"

# Minimum base mean expression value for a gene to be considered in the analysis
min_base_mean: 100

# Visualisation of DEG results (Volcano plot, PCA plot, Heatmap) ["yes",""]
DEG_visualization: "yes"

### FUNCTIONAL ANNOTATION of DEGs (InterProScan) ["yes",""] ###

functional_annotation: "yes"
#Absoulte path to the reference amino acid sequences
protein_fasta: /home/nanopore/projects/genome_annotation/results/fusarium_commune/braker/braker.aa

# InterProScan
GO_terms: "yes"

#Additional functional annotation of DEGs (eggNOG-mapper) (Required for pathway enrichment analysis)
eggnog_results: /home/nanopore/projects/rna_seq_workflow/resources/20250603_FCOM/MM_yrgnlcp8.emapper.annotations.tsv


### PATHWAY ENRICHMENT ANALYSIS of DEGs (GSEA) (KEGG) ["yes",""]  ###
enrichment_analysis: "yes"

# List of KEGG pathway names to be ignored in the enrichment analysis
filter_terms: ["Carbon metabolism",
              "Pyruvate metabolism",
              "Glycolysis / Gluconeogenesis",
              "Citrate cycle (TCA cycle)",
              "Pentose phosphate pathway",
              "Glyoxylate and dicarboxylate metabolism",
              "Oxidative phosphorylation",
              "Sulfur metabolism",
              "Nitrogen metabolism",
              "2-Oxocarboxylic acid metabolism",
              "MAPK signaling pathway",
              "AMPK signaling pathway",
              "Autophagy  - yeast",
              "Steroid biosynthesis",
]

