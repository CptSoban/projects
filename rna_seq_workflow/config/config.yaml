#This is the configuration file for the rna_seq_worklow.
#You have to modify this file to your needs and fill out every option (if not stated otherwise), 
#but do not add or remove options if your not 100% sure what you are doing!

#INPUT

#Absolute path to your RNAseq reads directory
seq_dir: "/home/marc/data/rna_seq_foxy/reads"

#Absolute path to the reference genome fasta
ref_genome: "/home/marc/data/rna_seq_foxy/genome/GCF_013085055.1/GCF_013085055.1_ASM1308505v1_genomic.fna"

#The ID for this analyis run (This will be used for naming the genome index files)
Run ID: "ASM1308505v1"

#Absolute path to the  GTF 
gtf: "/home/marc/data/rna_seq_foxy/genome/GCF_013085055.1/genomic.gtf"

#Sample info file 
sample_info:  "/home/marc/projects/rna_seq_workflow/resources/fusarium_oxysporum_info.tsv"

#Absoulte path to reference protein fasta
protein_fasta: "/home/marc/data/rna_seq_foxy/genome/GCF_000149955.1/protein.faa"

#PARAMETERS

#Computational ressources
threads:  2

#cutadapt
Trimming: "no" #yes or no
adapter_r1: "A" #adapter sequence forward reads
adapter_r2: "A" #adapter sequence reverse reads
quality_cutoff: ""  #quality filtering (leave empty for no filtering)

#Tool for alignment (hisat2 or star)
Aligner: "hisat2"

#Strandness 0 for Unstranded, 1 for Stranded or 2 for Reverse Strranded
Strandness: 2

#Gene set enrichment analysis (GSEA)
GSEA gene set: "GO_Biological_Process_2023"