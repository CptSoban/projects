### CONFIG for genome annotatio workflow ###
# Note: This is a sample configuration file. Adjust the paths and parameters as needed.

### General settings ###

# Run ID for the genome annotation (e.g. organism name)
Run ID: apiotrichum_laibachii

# Threads for parallel processing
threads: 10 

### Repeat masking, Alignment and Gene Prediction ###

# Path to the genome assembly file
# The fasta should NOT contain any whitespace in the header (shorten or replace with underscores with sed 's/ /_/g' $FASTA)
