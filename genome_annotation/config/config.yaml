# DFAM taxon for repeat masking
# DFAM taxon: ascomycota

# Path to the RNA reads directory (if using local RNA reads)
rna_reads_directory : /home/nanopore/projects/rna_seq_workflow/resources/20250528_APILAI
#Strandness of RNA-seq reads ["",0] for Unstranded, ["FR",1] for Stranded or ["RF",2] for Reverse Stranded
Strandness: ["RF",2]

# SRA accession for RNA reads (Only applicable if not using local RNA reads)
SRA_accession:

