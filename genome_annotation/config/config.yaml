### CONFIG for genome annotatio workflow ###
# Note: This is a sample configuration file. Adjust the paths and parameters as needed.

### General settings ###

# Run ID for the genome annotation (e.g. organism name)
Run ID: clonostachys_rosea

# Threads for parallel processing
threads: 16 # For stability, calculate threads as 2x the available cores (max cores=8)

### Repeat masking, Alignment and Gene Prediction ###

# Path to the genome assembly file
# The fasta should NOT contain any whitespace in the header (shorten or replace with underscores with sed 's/ /_/g' $FASTA)
genome_assembly: /home/nanopore/projects/simona/cloro_assembly/flye_assembly/clonostachys_rosea.fasta

# DFAM taxon for repeat masking
DFAM taxon: ascomycota

# Path to the RNA reads directory (if using local RNA reads)
rna_reads_directory : /home/nanopore/projects/rna_seq_workflow/resources/20250206_CLORO
#Strandness of RNA-seq reads ["",0] for Unstranded, ["FR",1] for Stranded or ["RF",2] for Reverse Stranded
Strandness: ["RF",2]

# SRA accession for RNA reads (Only applicable if not using local RNA reads)
SRA_accession: 

